<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenShell Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--surface:#111827;--border:#1e293b;--card:#151d2e;
  --text:#e2e8f0;--text-dim:#94a3b8;--accent:#22d3ee;--accent-dim:#0891b2;
  --green:#34d399;--red:#f87171;--yellow:#fbbf24;--purple:#a78bfa;
  --radius:12px;
}
html{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;padding:0}

header{
  background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);
  border-bottom:1px solid var(--border);padding:2rem 2rem 1.5rem;
  position:relative;overflow:hidden;
}
header::before{
  content:'';position:absolute;top:-50%;right:-20%;width:500px;height:500px;
  background:radial-gradient(circle,rgba(34,211,238,.08) 0%,transparent 70%);
  pointer-events:none;
}
.header-row{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;position:relative}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.02em}
h1 span{color:var(--accent);font-family:'JetBrains Mono',monospace}
.health-badge{
  display:flex;align-items:center;gap:.5rem;
  font-size:.8rem;color:var(--text-dim);
  background:var(--surface);border:1px solid var(--border);
  padding:.4rem .75rem;border-radius:20px;
}
.health-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim)}
.health-dot.ok{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.5)}
.health-dot.err{background:var(--red);box-shadow:0 0 8px rgba(248,113,113,.5)}

main{max-width:1200px;margin:0 auto;padding:2rem}

.toolbar{
  display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;
  flex-wrap:wrap;
}
.toolbar .count{
  font-size:.85rem;color:var(--text-dim);
  font-family:'JetBrains Mono',monospace;
}
.toolbar .spacer{flex:1}

input[type=text]{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:.55rem .85rem;border-radius:8px;
  font-size:.9rem;outline:none;transition:border-color .2s;
  width:220px;font-family:'JetBrains Mono',monospace;
}
input[type=text]:focus{border-color:var(--accent)}
input[type=text]::placeholder{color:var(--text-dim);opacity:.6}

button{
  cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:600;
  border:none;border-radius:8px;padding:.55rem 1.1rem;transition:all .15s;
}
.btn-create{
  background:linear-gradient(135deg,var(--accent-dim),var(--accent));
  color:#0a0e17;
}
.btn-create:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn-create:active{transform:translateY(0)}
.btn-create:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-refresh{
  background:var(--surface);color:var(--text-dim);border:1px solid var(--border);
}
.btn-refresh:hover{border-color:var(--accent);color:var(--text)}
.btn-delete{
  background:transparent;color:var(--red);border:1px solid transparent;
  padding:.35rem .65rem;font-size:.75rem;
}
.btn-delete:hover{border-color:var(--red);background:rgba(248,113,113,.08)}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:1rem;
}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.25rem;transition:border-color .2s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.card:hover{border-color:rgba(34,211,238,.25);box-shadow:0 4px 24px rgba(0,0,0,.3)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.card-name{
  font-family:'JetBrains Mono',monospace;font-weight:600;font-size:1rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;
}
.phase{
  display:inline-flex;align-items:center;gap:.35rem;
  font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  padding:.25rem .6rem;border-radius:20px;
}
.phase-1{background:rgba(251,191,36,.12);color:var(--yellow)}
.phase-2{background:rgba(52,211,153,.12);color:var(--green)}
.phase-3{background:rgba(248,113,113,.12);color:var(--red)}
.phase-4{background:rgba(167,139,250,.12);color:var(--purple)}
.phase-0,.phase-5{background:rgba(148,163,184,.12);color:var(--text-dim)}
.phase-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.card-details{font-size:.8rem;color:var(--text-dim);display:flex;flex-direction:column;gap:.3rem}
.card-details .row{display:flex;gap:.5rem}
.card-details .label{color:var(--text-dim);min-width:60px;opacity:.7}
.card-details .value{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.75rem;word-break:break-all}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:.75rem;padding-top:.65rem;border-top:1px solid var(--border)}
.card-time{font-size:.7rem;color:var(--text-dim);font-family:'JetBrains Mono',monospace}
.card-condition{font-size:.7rem;color:var(--text-dim);margin-top:.5rem;font-style:italic}

.empty{
  text-align:center;padding:4rem 2rem;
  color:var(--text-dim);
}
.empty-icon{font-size:3rem;margin-bottom:1rem;opacity:.3}
.empty h3{font-size:1.1rem;color:var(--text);margin-bottom:.5rem}
.empty p{font-size:.85rem}

.spinner{
  display:inline-block;width:14px;height:14px;
  border:2px solid transparent;border-top-color:currentColor;
  border-radius:50%;animation:spin .6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{
  position:fixed;bottom:1.5rem;right:1.5rem;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:.75rem 1.25rem;border-radius:10px;
  font-size:.85rem;box-shadow:0 8px 32px rgba(0,0,0,.4);
  transform:translateY(120%);transition:transform .3s ease;z-index:100;
}
.toast.show{transform:translateY(0)}
.toast.error{border-color:var(--red);color:var(--red)}
.toast.success{border-color:var(--green);color:var(--green)}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1><span>OpenShell</span> Dashboard</h1>
    <div class="health-badge" id="health">
      <div class="health-dot" id="health-dot"></div>
      <span id="health-text">Connecting...</span>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <span class="count" id="count">—</span>
    <div class="spacer"></div>
    <input type="text" id="sandbox-name" placeholder="sandbox name (optional)">
    <button class="btn-create" id="btn-create" onclick="createSandbox()">Create Sandbox</button>
    <button class="btn-refresh" onclick="refresh()">Refresh</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const nameInput = document.getElementById('sandbox-name');
const btnCreate = document.getElementById('btn-create');

const PHASES = {0:'Unspecified',1:'Provisioning',2:'Ready',3:'Error',4:'Deleting',5:'Unknown'};

function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.className = 'toast', 3000);
}

function timeAgo(ms) {
  if (!ms) return '—';
  const diff = Date.now() - ms;
  if (diff < 60000) return Math.floor(diff/1000) + 's ago';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  return Math.floor(diff/86400000) + 'd ago';
}

function renderCard(s) {
  const phase = s.phase_id || 0;
  const phaseName = s.phase || PHASES[phase];
  const condMsg = (s.conditions && s.conditions.length)
    ? s.conditions.map(c => c.message).filter(Boolean).join('; ')
    : '';

  return `
    <div class="card">
      <div class="card-header">
        <div class="card-name" title="${s.name}">${s.name}</div>
        <span class="phase phase-${phase}"><span class="phase-dot"></span>${phaseName}</span>
      </div>
      <div class="card-details">
        <div class="row"><span class="label">ID</span><span class="value">${s.id.slice(0,8)}…</span></div>
        ${s.pod ? `<div class="row"><span class="label">Pod</span><span class="value">${s.pod}</span></div>` : ''}
        <div class="row"><span class="label">NS</span><span class="value">${s.namespace}</span></div>
      </div>
      ${condMsg ? `<div class="card-condition">${condMsg}</div>` : ''}
      <div class="card-footer">
        <span class="card-time">${timeAgo(s.created_at)}</span>
        <button class="btn-delete" onclick="deleteSandbox(this.dataset.name)" data-name="${s.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">Delete</button>
      </div>
    </div>`;
}

async function refresh() {
  try {
    const res = await fetch('/api/sandboxes');
    const data = await res.json();
    if (data.error) { toast(data.error, 'error'); return; }
    const list = data.sandboxes || [];
    countEl.textContent = list.length + ' sandbox' + (list.length !== 1 ? 'es' : '');
    if (list.length === 0) {
      grid.innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          <div class="empty-icon">⬡</div>
          <h3>No sandboxes</h3>
          <p>Create one to get started</p>
        </div>`;
    } else {
      list.sort((a,b) => (b.created_at||0) - (a.created_at||0));
      grid.innerHTML = list.map(renderCard).join('');
    }
  } catch(e) { toast('Failed to fetch sandboxes', 'error'); }
}

async function createSandbox() {
  const name = nameInput.value.trim();
  btnCreate.disabled = true;
  btnCreate.innerHTML = '<span class="spinner"></span> Creating…';
  try {
    const res = await fetch('/api/sandboxes', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name }),
    });
    const data = await res.json();
    if (data.error) { toast(data.error, 'error'); return; }
    toast('Sandbox "' + (data.sandbox?.name || name) + '" created');
    nameInput.value = '';
    refresh();
  } catch(e) { toast('Create failed: ' + e.message, 'error'); }
  finally {
    btnCreate.disabled = false;
    btnCreate.textContent = 'Create Sandbox';
  }
}

async function deleteSandbox(name) {
  if (!confirm('Delete sandbox "' + name + '"?')) return;
  try {
    const res = await fetch('/api/sandboxes/' + encodeURIComponent(name), {method:'DELETE'});
    const data = await res.json();
    if (data.error) { toast(data.error, 'error'); return; }
    toast('Sandbox "' + name + '" deleted');
    refresh();
  } catch(e) { toast('Delete failed: ' + e.message, 'error'); }
}

async function checkHealth() {
  const dot = document.getElementById('health-dot');
  const text = document.getElementById('health-text');
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    if (data.version) {
      dot.className = 'health-dot ok';
      text.textContent = 'Gateway v' + data.version;
    } else {
      dot.className = 'health-dot err';
      text.textContent = data.error ? 'Error' : 'Unknown';
    }
  } catch {
    dot.className = 'health-dot err';
    text.textContent = 'Disconnected';
  }
}

nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') createSandbox(); });

checkHealth();
refresh();
setInterval(refresh, 5000);
setInterval(checkHealth, 15000);
</script>
</body>
</html>
