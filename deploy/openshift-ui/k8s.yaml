#
# Deployment manifest for the OpenShell Dashboard UI on OpenShift.
# Deploy with:  oc apply -f deploy/openshift-ui/k8s.yaml -n openshell
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshell-dashboard
  namespace: openshell
  labels:
    app.kubernetes.io/name: openshell-dashboard
    app.kubernetes.io/part-of: openshell
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshell-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell-dashboard
        app.kubernetes.io/part-of: openshell
    spec:
      containers:
        - name: dashboard
          # Replace with your registry. Build with: podman build -t <registry>/openshell-dashboard:latest .
          image: quay.io/sauagarw/openshell-dashboard:latest
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: OPENSHELL_GATEWAY
              value: openshell.openshell.svc.cluster.local:8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: openshell-dashboard
  namespace: openshell
  labels:
    app.kubernetes.io/name: openshell-dashboard
    app.kubernetes.io/part-of: openshell
spec:
  selector:
    app.kubernetes.io/name: openshell-dashboard
  ports:
    - port: 8080
      targetPort: 5000
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openshell-dashboard
  namespace: openshell
  labels:
    app.kubernetes.io/name: openshell-dashboard
    app.kubernetes.io/part-of: openshell
spec:
  to:
    kind: Service
    name: openshell-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
